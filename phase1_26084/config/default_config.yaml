# SIH 26084: Convective-scale nowcasting Configuration
domain:
  name: "India_Regional_Testbed"
  min_lat: 12.0
  max_lat: 14.5
  min_lon: 79.0
  max_lon: 81.5
  spatial_resolution_km: 2.0  # Common grid target 1-3 km
  spatial_resolution_deg: 0.018  # ~2 km

data_quality_control:
  radar:
    reflectivity_min_dbz: -10.0
    reflectivity_max_dbz: 80.0
    velocity_min_ms: -75.0
    velocity_max_ms: 75.0
  satellite:
    bt_min_k: 160.0
    bt_max_k: 340.0
  surface_weather:
    temp_min_c: -30.0
    temp_max_c: 55.0
    rh_min_pct: 0.0
    rh_max_pct: 100.0
    pressure_min_hpa: 850.0
    pressure_max_hpa: 1050.0
    wind_spd_max_ms: 80.0
  lightning:
    current_min_ka: -300.0
    current_max_ka: 300.0

convective_initiation:
  min_radar_reflectivity_dbz: 35.0
  severe_reflectivity_dbz: 45.0
  satellite_bt_deep_convection_k: 235.0
  satellite_cooling_rate_k_per_15min: -4.0
  min_lightning_count: 1
  min_cell_area_km2: 12.0
  max_cell_area_km2: 5000.0
  confidence_weights:
    radar_weight: 0.40
    satellite_weight: 0.30
    lightning_weight: 0.20
    trend_weight: 0.10

storm_tracking:
  core_reflectivity_threshold_dbz: 40.0
  min_storm_area_km2: 15.0
  max_tracking_distance_km: 35.0
  max_tracking_time_gap_minutes: 30.0
  optical_flow_levels: 3

hazards:
  lightning:
    flash_density_severe_threshold: 0.5  # flashes / km2 / hr
    min_confidence: 0.50
  hail:
    posh_dbz_threshold: 48.0
    mesh_dbz_threshold: 55.0
    bt_temp_threshold_k: 220.0
  downburst:
    velocity_diff_threshold_ms: 18.0
    reflectivity_core_dbz: 50.0
  cloudburst:
    extreme_rain_rate_mm_hr: 50.0
    flash_flood_dbz_threshold: 48.0
    min_continuous_duration_min: 30

nowcast:
  horizons_minutes: [15, 30, 60, 120, 180, 240, 300, 360]
  uncertainty_decay_rate_per_hour: 0.12
  extrapolation_method: "advection_vector"  # advection_vector or optical_flow

replay:
  time_step_minutes: 10
  playback_speed_multiplier: 1.0
